services:
  apache:
    image: tugboatqa/php:8.2-apache
    default: true
    symlink: false
    environment:
      DB_TYPE: sqlite
      DB_PATH: ${TUGBOAT_ROOT}/data/camabox.db
    commands:
      init:
        - a2enmod rewrite
        - mkdir -p "${TUGBOAT_ROOT}/data"
        - ln -snf "${TUGBOAT_ROOT}/site" "${DOCROOT}"
        - cp "${TUGBOAT_ROOT}/docker/apache-vhost.conf" /etc/apache2/sites-available/000-default.conf
        - cp -r "${TUGBOAT_ROOT}/api" "${DOCROOT}/api"

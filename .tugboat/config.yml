services:
  apache:
    image: tugboatqa/php:apache-trixie
    default: true
    symlink: false
    environment:
      DB_TYPE: sqlite
      DB_PATH: /tmp/camabox.db
    commands:
      init:
        - a2enmod rewrite
        - ln -snf "${TUGBOAT_ROOT}/site" "${DOCROOT}"
        - cp "${TUGBOAT_ROOT}/docker/apache-vhost.conf" /etc/apache2/sites-available/000-default.conf
        - cp -r "${TUGBOAT_ROOT}/api" "${DOCROOT}/api"
        - php -r "\$db=new SQLite3('/tmp/camabox.db');\$db->exec(file_get_contents('${TUGBOAT_ROOT}/db/schema.sqlite.sql'));"

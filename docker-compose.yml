services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/html/site
      - ./api:/var/www/html/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: camabox
      DB_USER: camabox
      DB_PASS: camabox_secret

  db:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: camabox
      MYSQL_USER: camabox
      MYSQL_PASSWORD: camabox_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
